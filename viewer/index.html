<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>神楽 澪 — 可愛い判定ビューア</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23A63A3A'/></svg>">
<style>
  :root{
    --bg:#0b0b0e; --panel:#15151a; --line:#2a2a32; --text:#e8e6e3;
    --muted:#85858f; --accent:#A63A3A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--text);overflow:hidden;
    font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
    font-size:13px;
  }
  #app{display:flex;height:100vh}

  /* ---- viewport ---- */
  #stage{flex:1;position:relative;min-width:0}
  #stage canvas{display:block;width:100%;height:100%}

  #drop{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;text-align:center;
    background:rgba(11,11,14,.92);transition:background .15s;
  }
  #drop.hover{background:rgba(166,58,58,.15)}
  #drop h2{font-size:15px;letter-spacing:.15em;font-weight:500}
  #drop p{color:var(--muted);font-size:12px;line-height:1.9}
  #drop .big{font-size:34px;opacity:.35}

  #hud{
    position:absolute;left:14px;bottom:14px;font-size:10.5px;color:var(--muted);
    letter-spacing:.08em;pointer-events:none;line-height:1.7;
  }

  /* ---- panel ---- */
  #panel{
    width:300px;flex:none;background:var(--panel);border-left:1px solid var(--line);
    overflow-y:auto;padding:18px 16px 40px;
  }
  #panel::-webkit-scrollbar{width:8px}
  #panel::-webkit-scrollbar-thumb{background:#2f2f38;border-radius:4px}

  h1{font-size:13px;letter-spacing:.16em;font-weight:600;margin-bottom:2px}
  h1 small{display:block;font-size:9.5px;letter-spacing:.28em;color:var(--muted);margin-top:4px;font-weight:400}
  .sep{height:1px;background:var(--line);margin:16px 0}

  .grp{margin-bottom:16px}
  .grp > label{display:block;font-size:10px;letter-spacing:.18em;color:var(--accent);margin-bottom:8px;font-weight:600}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button{
    flex:1;min-width:0;padding:8px 6px;background:#1e1e26;color:var(--text);
    border:1px solid var(--line);border-radius:4px;cursor:pointer;
    font-size:11.5px;font-family:inherit;transition:.12s;white-space:nowrap;
  }
  button:hover{background:#282833;border-color:#3b3b47}
  button.on{background:var(--accent);border-color:var(--accent);color:#fff}

  .chk{display:flex;align-items:flex-start;gap:9px;padding:7px 0;cursor:pointer;line-height:1.5}
  .chk input{margin-top:2px;accent-color:var(--accent);flex:none;width:14px;height:14px}
  .chk span{font-size:11.5px;color:#c9c7c4}
  .chk input:checked + span{color:var(--muted);text-decoration:line-through}

  .expr{display:flex;align-items:center;gap:8px;margin-bottom:6px}
  .expr span{width:74px;font-size:10.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .expr input[type=range]{flex:1;accent-color:var(--accent);height:3px}

  .note{font-size:10.5px;color:var(--muted);line-height:1.8;border-left:2px solid var(--accent);padding-left:10px}
  .file{display:none}
  .link{color:var(--accent);cursor:pointer;text-decoration:underline}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
    "@pixiv/three-vrm": "https://unpkg.com/@pixiv/three-vrm@3.0.0/lib/three-vrm.module.js"
  }
}
</script>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="drop">
      <div class="big">⬒</div>
      <h2>VRM をここにドロップ</h2>
      <p>
        VRoid Studio から書き出した <b>.vrm</b> ファイルを放り込む<br>
        または <span class="link" id="pick">ファイルを選ぶ</span>
      </p>
    </div>
    <div id="hud">
      ドラッグ=回転 / ホイール=ズーム / 右ドラッグ=平行移動
    </div>
  </div>

  <aside id="panel">
    <h1>可愛い判定ビューア
      <small>KAGURA MIO / LOOK CHECK</small>
    </h1>
    <div class="sep"></div>

    <div class="grp">
      <label>CAMERA</label>
      <div class="row">
        <button data-cam="full" class="on">全身</button>
        <button data-cam="bust">バスト</button>
        <button data-cam="face">顔</button>
      </div>
    </div>

    <div class="grp">
      <label>LIGHTING</label>
      <div class="row">
        <button data-light="neutral" class="on">標準</button>
        <button data-light="factory">廃工場</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button data-light="rim">リム強</button>
        <button data-light="flat">フラット</button>
      </div>
    </div>

    <div class="grp">
      <label>BACKGROUND</label>
      <div class="row">
        <button data-bg="factory" class="on">#4A4A4E</button>
        <button data-bg="black">黒</button>
        <button data-bg="white">白</button>
      </div>
    </div>

    <div class="grp">
      <label>POSE</label>
      <div class="row">
        <button data-pose="t" class="on">Tポーズ</button>
        <button data-pose="a">Aポーズ</button>
      </div>
    </div>

    <div class="grp">
      <label>TURNTABLE</label>
      <div class="row">
        <button id="spin">自動回転 OFF</button>
        <button id="shot">スクショ保存</button>
      </div>
    </div>

    <div class="sep"></div>

    <div class="grp">
      <label>EXPRESSION</label>
      <div id="exprList"><div class="note">VRM を読み込むと表情が並びます</div></div>
    </div>

    <div class="sep"></div>

    <div class="grp">
      <label>判定チェック</label>
      <label class="chk"><input type="checkbox"><span>正面バストで目が魅力的</span></label>
      <label class="chk"><input type="checkbox"><span>引きのシルエットで強そう</span></label>
      <label class="chk"><input type="checkbox"><span>灰色背景で埋もれない</span></label>
      <label class="chk"><input type="checkbox"><span>痛み表情が「痛そう」</span></label>
      <label class="chk"><input type="checkbox"><span>3秒見て違和感が残らない</span></label>
    </div>

    <div class="sep"></div>
    <div class="note">
      1つでも落ちたら VRoid の顔に戻る。<br>
      戦闘実装には進まない。
    </div>
  </aside>
</div>

<input type="file" id="file" class="file" accept=".vrm">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { VRMLoaderPlugin, VRMUtils } from '@pixiv/three-vrm';

/* ------------------------------------------------------------------ setup */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  alpha: false,
  preserveDrawingBuffer: true
});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(stage.clientWidth, stage.clientHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#4A4A4E');

const camera = new THREE.PerspectiveCamera(35, 1, 0.01, 100);
camera.position.set(0, 1.05, 3.4);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.target.set(0, 0.95, 0);
controls.minDistance = 0.25;
controls.maxDistance = 8;

/* ------------------------------------------------------------------ lights */
const hemi = new THREE.HemisphereLight(0xffffff, 0x444455, 1.6);
scene.add(hemi);

const key = new THREE.DirectionalLight(0xfff3e8, 2.2);
key.position.set(1.6, 3.2, 2.4);
scene.add(key);

const fill = new THREE.DirectionalLight(0xc8d4ff, 0.7);
fill.position.set(-2.4, 1.4, 1.2);
scene.add(fill);

const rim = new THREE.DirectionalLight(0xdfe8ff, 1.4);
rim.position.set(-1.0, 2.2, -3.0);
scene.add(rim);

const LIGHT_PRESETS = {
  neutral: { hemi: 1.6, key: 2.2, fill: 0.7, rim: 1.4, exposure: 1.0 },
  factory: { hemi: 0.5, key: 2.6, fill: 0.15, rim: 2.4, exposure: 0.92 },
  rim:     { hemi: 0.9, key: 1.4, fill: 0.3, rim: 3.2, exposure: 1.05 },
  flat:    { hemi: 3.0, key: 0.6, fill: 0.6, rim: 0.4, exposure: 1.0 }
};

const BG_PRESETS = {
  factory: '#4A4A4E',
  black:   '#0b0b0e',
  white:   '#eceae7'
};

/* ------------------------------------------------------------------ state */
let vrm = null;
let modelRoot = null;
let autoSpin = false;
let headWorld = new THREE.Vector3(0, 1.55, 0);
let modelHeight = 1.68;
let modelTop = 1.68;

/* ------------------------------------------------------------------ loader */
const loader = new GLTFLoader();
loader.register((parser) => new VRMLoaderPlugin(parser));

function loadVRM(url) {
  document.getElementById('drop').style.display = 'none';
  loader.load(
    url,
    (gltf) => {
      if (modelRoot) { scene.remove(modelRoot); disposeTree(modelRoot); modelRoot = null; }

      vrm = gltf.userData.vrm;
      if (!vrm) {
        alert('VRM として読み込めませんでした。VRoid から .vrm で書き出してください。');
        document.getElementById('drop').style.display = 'flex';
        return;
      }

      try { VRMUtils.removeUnnecessaryVertices(gltf.scene); } catch (e) {}
      try { VRMUtils.combineSkeletons(gltf.scene); } catch (e) {}
      try { VRMUtils.rotateVRM0(vrm); } catch (e) {}

      vrm.scene.traverse((o) => {
        if (o.isMesh) {
          o.frustumCulled = false;
          if (o.material) {
            o.material.side = THREE.FrontSide;
            if ('envMapIntensity' in o.material) o.material.envMapIntensity = 0.6;
          }
        }
      });

      modelRoot = vrm.scene;
      scene.add(modelRoot);
      modelRoot.updateMatrixWorld(true);

      // measurements
      const box = new THREE.Box3().setFromObject(modelRoot);
      const size = new THREE.Vector3(); box.getSize(size);
      modelHeight = size.y || 1.68;
      modelTop = box.max.y || 1.68;

      let headNode = null;
      try { headNode = vrm.humanoid?.getRawBoneNode?.('head'); } catch (e) {}
      if (!headNode) { try { headNode = vrm.humanoid?.getNormalizedBoneNode?.('head'); } catch (e) {} }
      if (headNode) {
        headNode.updateWorldMatrix(true, false);
        headWorld.setFromMatrixPosition(headNode.matrixWorld);
      } else {
        headWorld.set(0, box.max.y - modelHeight * 0.09, 0);
      }
      // 頭頂がおかしい場合のフォールバック
      if (headWorld.y < modelHeight * 0.7) {
        headWorld.set(0, box.max.y - modelHeight * 0.09, 0);
      }

      buildExpressionUI(vrm);
      setCamera('full');

      window.__mio = { modelHeight, headWorld, box };
    },
    undefined,
    (err) => {
      console.error(err);
      alert('読み込みに失敗しました:\n' + err.message);
      document.getElementById('drop').style.display = 'flex';
    }
  );
}

function disposeTree(root) {
  root.traverse((o) => {
    if (o.isMesh) {
      o.geometry?.dispose();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      mats.forEach((m) => m?.dispose?.());
    }
  });
}

/* ------------------------------------------------------------------ camera */
function setCamera(mode) {
  const h = modelHeight;
  const top = modelTop;
  if (mode === 'full') {
    controls.target.set(0, h * 0.50, 0);
    camera.position.set(0, h * 0.52, h * 2.05);
  } else if (mode === 'bust') {
    const y = top - h * 0.14;
    controls.target.set(0, y, 0);
    camera.position.set(0, y + h * 0.01, h * 0.62);
  } else if (mode === 'face') {
    const y = top - h * 0.10;
    controls.target.set(0, y, 0);
    camera.position.set(0, y, h * 0.35);
  }
  controls.update();
}

document.querySelectorAll('[data-cam]').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-cam]').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    setCamera(b.dataset.cam);
  });
});

/* ------------------------------------------------------------------ lights/ui */
document.querySelectorAll('[data-light]').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-light]').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    const p = LIGHT_PRESETS[b.dataset.light];
    hemi.intensity = p.hemi;
    key.intensity = p.key;
    fill.intensity = p.fill;
    rim.intensity = p.rim;
    renderer.toneMappingExposure = p.exposure;
  });
});

document.querySelectorAll('[data-bg]').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-bg]').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    scene.background = new THREE.Color(BG_PRESETS[b.dataset.bg]);
  });
});

/* ------------------------------------------------------------------ pose */
function setPose(mode) {
  if (!vrm?.humanoid) return;
  const angle = mode === 'a' ? 0.62 : 0;
  ['left', 'right'].forEach((side) => {
    const b = vrm.humanoid.getNormalizedBoneNode(side + 'UpperArm');
    if (!b) return;
    b.rotation.z = (side === 'left' ? -1 : 1) * angle;
    b.updateMatrix();
  });
}

document.querySelectorAll('[data-pose]').forEach((b) => {
  b.addEventListener('click', () => {
    document.querySelectorAll('[data-pose]').forEach((x) => x.classList.remove('on'));
    b.classList.add('on');
    setPose(b.dataset.pose);
  });
});

/* ------------------------------------------------------------------ expression */
function buildExpressionUI(v) {
  const wrap = document.getElementById('exprList');
  wrap.innerHTML = '';
  const mgr = v.expressionManager;
  if (!mgr) {
    wrap.innerHTML = '<div class="note">この VRM には表情がありません</div>';
    return;
  }
  const list = mgr.expressions || [];
  if (!list.length) {
    wrap.innerHTML = '<div class="note">表情が見つかりません</div>';
    return;
  }
  list.forEach((e) => {
    const name = e.expressionName;
    const row = document.createElement('div');
    row.className = 'expr';
    const label = document.createElement('span');
    label.textContent = name;
    label.title = name;
    const range = document.createElement('input');
    range.type = 'range';
    range.min = 0; range.max = 1; range.step = 0.01; range.value = 0;
    range.addEventListener('input', () => {
      mgr.setValue(name, parseFloat(range.value));
    });
    row.appendChild(label);
    row.appendChild(range);
    wrap.appendChild(row);
  });

  const reset = document.createElement('button');
  reset.textContent = '全てリセット';
  reset.style.width = '100%';
  reset.style.marginTop = '8px';
  reset.addEventListener('click', () => {
    list.forEach((e) => {
      mgr.setValue(e.expressionName, 0);
      const r = wrap.querySelectorAll('input[type=range]');
      r.forEach((x) => (x.value = 0));
    });
  });
  wrap.appendChild(reset);
}

/* ------------------------------------------------------------------ misc UI */
const spinBtn = document.getElementById('spin');
spinBtn.addEventListener('click', () => {
  autoSpin = !autoSpin;
  spinBtn.textContent = '自動回転 ' + (autoSpin ? 'ON' : 'OFF');
  spinBtn.classList.toggle('on', autoSpin);
});

document.getElementById('shot').addEventListener('click', () => {
  renderer.render(scene, camera);
  const a = document.createElement('a');
  a.download = `mio_${Date.now()}.png`;
  a.href = renderer.domElement.toDataURL('image/png');
  a.click();
});

const fileInput = document.getElementById('file');
document.getElementById('pick').addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  if (f) loadVRM(URL.createObjectURL(f));
});

const drop = document.getElementById('drop');
['dragenter', 'dragover'].forEach((ev) =>
  window.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('hover'); })
);
['dragleave', 'drop'].forEach((ev) =>
  window.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('hover'); })
);
window.addEventListener('drop', (e) => {
  const f = e.dataTransfer?.files?.[0];
  if (!f) return;
  if (!f.name.toLowerCase().endsWith('.vrm')) {
    alert('.vrm ファイルをドロップしてください');
    return;
  }
  loadVRM(URL.createObjectURL(f));
});

/* ------------------------------------------------------------------ resize */
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ------------------------------------------------------------------ loop */
const clock = new THREE.Clock();
let acc = 0;
function tick() {
  requestAnimationFrame(tick);
  const dt = clock.getDelta();
  acc += dt;

  if (autoSpin && modelRoot) modelRoot.rotation.y += dt * 0.55;

  if (vrm?.update) vrm.update(dt);

  controls.update();
  renderer.render(scene, camera);
}
tick();
</script>
</body>
</html>
