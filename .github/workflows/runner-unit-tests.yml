name: Unity runner unit tests

on:
  pull_request:
    paths:
      - 'MioPrototype/tools/**'
      - '.github/workflows/runner-unit-tests.yml'
  push:
    branches: ['**']
    paths:
      - 'MioPrototype/tools/**'
      - '.github/workflows/runner-unit-tests.yml'

permissions:
  contents: read

jobs:
  runner-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Lint tools
        run: |
          python -m pip install --quiet ruff==0.15.9
          python -m ruff check MioPrototype/tools
      - name: Test tool exit handling without launching Unity
        run: python -m unittest discover -s MioPrototype/tools -p 'test_*.py' -v
