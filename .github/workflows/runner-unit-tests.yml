name: Unity runner unit tests

on:
  pull_request:
    paths:
      - 'MioPrototype/tools/preview.py'
      - 'MioPrototype/tools/test_preview_build.py'
      - 'MioPrototype/tools/run_tests.py'
      - 'MioPrototype/tools/test_run_tests.py'
      - '.github/workflows/runner-unit-tests.yml'
  push:
    branches: ['**']
    paths:
      - 'MioPrototype/tools/preview.py'
      - 'MioPrototype/tools/test_preview_build.py'
      - 'MioPrototype/tools/run_tests.py'
      - 'MioPrototype/tools/test_run_tests.py'
      - '.github/workflows/runner-unit-tests.yml'

permissions:
  contents: read

jobs:
  runner-unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test tool exit handling without launching Unity
        run: python -m unittest discover -s MioPrototype/tools -p 'test_*.py' -v
